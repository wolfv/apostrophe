[workspace]
name = "apostrophe"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
meson = ">=1.3"
ninja = "*"
pkg-config = "*"
c-compiler = "*"
curl = "*"
glib = "*"
gobject-introspection = "*"
gtk4 = ">=4.16"
libadwaita = "*"
gtksourceview = ">=5.10"
pygobject = "*"
enchant = "*"
expat = "*"
icu = "*"
pandoc = "*"
pypandoc = "*"
regex = "*"
chardet = "*"
pytest = "*"
pylint = "*"
rattler-build = "*"

[tasks]
libspelling = "bash scripts/install-libspelling.sh"
configure = { cmd = "meson setup builddir --prefix=$CONDA_PREFIX -Dprofile=development && mkdir -p builddir/data/glib-2.0/schemas && cp data/*.gschema.xml builddir/data/glib-2.0/schemas/ && glib-compile-schemas builddir/data/glib-2.0/schemas", depends-on = ["libspelling"] }
build = { cmd = "meson compile -C builddir", depends-on = ["configure"] }
start = { cmd = "./builddir/local-apostrophe", depends-on = ["build"] }
test = { cmd = "python -m pytest tests", depends-on = ["build"] }
build-libspelling-package = "bash scripts/build-libspelling-package.sh"
